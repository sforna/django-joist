name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The same declared combinations as tests.yml, repeated here because a tag
      # is what publishes: a release has to prove the matrix it ships, not only
      # that the branch was green at some earlier commit. Kept as one list in
      # two places rather than a reusable workflow; when either changes, change
      # both. The `Django latest` canary is deliberately not repeated - it
      # watches the next Django, and a release should not be blocked by it.
      matrix:
        python: ["3.13", "3.14"]
        django: ["~=5.2.0", "~=6.0.0", "~=6.1.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django${{ matrix.django }}" pytest pytest-django
      - run: pip install -e .
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tag matches package version
        run: >-
          python -c "import os, tomllib;
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}',
          f\"tag {os.environ['GITHUB_REF_NAME']} does not match version {version}\""
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
