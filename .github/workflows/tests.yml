name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A superseded push cancels the run it replaced instead of queueing a whole
# matrix behind it. Nothing here needs more than read access to the checkout.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Derived from the package metadata rather than from taste: the Python
      # entries are `requires-python` (the 3.13 floor) plus the newest release,
      # the Django entries are exactly the `Framework :: Django :: *`
      # classifiers, and every combination of the two is here - six jobs, each
      # one a combination Django itself supports (5.2 took Python 3.14 in
      # 5.2.8; 6.0 and 6.1 take 3.12+). A version added to pyproject.toml
      # belongs in this list in the same commit, and in release.yml, which
      # repeats the matrix to gate a tag.
      matrix:
        python: ["3.13", "3.14"]
        django: ["~=5.2.0", "~=6.0.0", "~=6.1.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django${{ matrix.django }}" pytest pytest-django
      - run: pip install -e .
      - run: python -m pytest -q

  # The requirement is `Django>=5.2`, with no ceiling, so the newest release is
  # part of the range the package declares and is tested on its own rather than
  # only when someone remembers to add it to the matrix above. Pinned to the
  # Python floor, the combination a project on the oldest supported Python gets
  # from a plain install. Red here means a Django release moved something under
  # us: fix it, or give the requirement a ceiling deliberately. Kept out of
  # release.yml: that one gates the declared combinations, this one is a canary
  # for the next Django rather than a promise about it.
  test-django-latest:
    runs-on: ubuntu-latest
    name: Django latest - Python 3.13
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --upgrade Django pytest pytest-django
      - run: pip install -e .
      - run: python -c "import django; print('resolved:', django.get_version())"
      - run: python -m pytest -q

  # Real PostgreSQL and MySQL lanes. The matrix above runs SQLite, which cannot
  # exercise the catalog readers (native types, comments, referential actions),
  # so the whole suite runs against a real server here. One combination each
  # keeps them cheap, and the two are the opposite ends of the declared range -
  # 5.2 with the Python floor, 6.1 with the newest Python - rather than the same
  # point twice: the catalog readers are Django-version-sensitive, so spanning
  # that axis is what earns the second lane. The tests pick their expectations
  # from JOIST_TEST_ENGINE, and their canary asserts the snapshot did not
  # silently fall back to SQLite.
  test-postgres:
    runs-on: ubuntu-latest
    name: PostgreSQL - Python 3.13 - Django 5.2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: joist
          POSTGRES_PASSWORD: password
          POSTGRES_DB: joist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U joist -d joist_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "Django~=5.2.0" pytest pytest-django "psycopg[binary]"
      - run: pip install -e .
      - run: python -m pytest -q
        env:
          JOIST_TEST_ENGINE: postgres
          JOIST_TEST_HOST: 127.0.0.1
          JOIST_TEST_PORT: "5432"
          JOIST_TEST_USER: joist
          JOIST_TEST_PASSWORD: password

  test-mysql:
    runs-on: ubuntu-latest
    name: MySQL - Python 3.14 - Django 6.1
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: joist_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # PyMySQL rather than mysqlclient: same protocol, no C build, so this lane
      # needs no system packages. tests/settings.py registers it as MySQLdb.
      - run: pip install "Django~=6.1.0" pytest pytest-django "pymysql[rsa]"
      - run: pip install -e .
      - run: python -m pytest -q
        env:
          JOIST_TEST_ENGINE: mysql
          JOIST_TEST_HOST: 127.0.0.1
          JOIST_TEST_PORT: "3306"
          JOIST_TEST_USER: root
          JOIST_TEST_PASSWORD: password

  # The client-side logic (selection, pan/zoom maths, diagram definition, the
  # render models) and the stylesheet invariants the port promises: contrast,
  # focus visibility, label casing. Node's built-in runner, so there is nothing
  # to install and no build step to keep working.
  js:
    runs-on: ubuntu-latest
    name: JavaScript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test

  # The browser lane: the real app served by Django, driven by Chromium (and by
  # Firefox for the label-geometry spec alone), so it needs both toolchains -
  # Python for the server, Node for the runner.
  browser:
    runs-on: ubuntu-latest
    name: Browser - Python 3.13 - Django 6.1 - Chromium + Firefox
    # The lane boots a dev server and a browser; a hang there should not sit on
    # the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install "Django~=6.1.0" -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
