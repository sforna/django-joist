name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["~=4.2.0", "~=5.0.0", "~=5.2.0", "~=6.0.0"]
        exclude:
          # Django 4.2 supports Python <=3.12; 5.0 <=3.12; 6.0 requires >=3.12.
          - {python: "3.13", django: "~=4.2.0"}
          - {python: "3.13", django: "~=5.0.0"}
          - {python: "3.10", django: "~=6.0.0"}
          - {python: "3.11", django: "~=6.0.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "Django${{ matrix.django }}" pytest pytest-django
      - run: pip install -e .
      - run: python -m pytest -q
