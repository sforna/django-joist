[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-joist"
version = "0.2.0"
description = "A live database structure viewer for Django. Renders your schema (never data) as a zoomable ER diagram, with exports, a schema doctor and a schema diff."
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = [
    "LICENSE",
    "src/django_joist/static/joist/vendor/mermaid.LICENSE",
    "src/django_joist/static/joist/fonts/IBM-Plex.LICENSE",
]
requires-python = ">=3.10"
authors = [{ name = "Simone Fornasiere", email = "s.fornasiere@gmail.com" }]
keywords = [
    "django",
    "database",
    "schema",
    "er-diagram",
    "erd",
    "database-diagram",
    "dbml",
    "data-dictionary",
    "introspection",
    "mermaid",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["Django>=5.2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "mypy", "django-stubs", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/sforna/django-joist"
Issues = "https://github.com/sforna/django-joist/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/django_joist"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# The shipped package only: tests and the demo are exercised by pytest, not
# type-checked (their fixtures are deliberately loose). Compatible with
# Django's own stubs rather than a hand-written ignore list.
files = ["src/django_joist"]
# Resolve `django_joist` from the source tree, so the check does not depend on
# an editable install being present (the pre-commit hook runs in its own env).
mypy_path = ["src", "."]
plugins = ["mypy_django_plugin.main"]
# Check the body of every function, annotated or not (that is what caught the
# fallback's non-existent recorder method); do not demand annotations on Django
# override points like `handle(self, *args, **options)`.
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# The test project's settings are read by the django-stubs plugin at runtime,
# not type-checked: it is a fixture, not shipped code.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
line-length = 120
target-version = "py310"
# Migrations are Django-generated; formatting them buys nothing and churns on
# every makemigrations.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
# Django's `class Meta` attributes (constraints, indexes) are class-level and
# mutable by design, which RUF012 reads as a bug.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# The config test evaluates attribute access inside `pytest.raises`, which is
# an expression for its side effect by design.
"tests/test_config.py" = ["B018"]

[tool.ruff.lint.isort]
# The demo project's apps are first-party. Without this, ruff treats them as
# third-party and merges them into the Django import block.
known-first-party = ["catalog", "inventory", "sales", "support", "proj"]
